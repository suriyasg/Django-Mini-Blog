{% extends "base_generic.html" %}

{% block content %}
  <h1>Add Comment on: {{ blog.title }}</h1>
  <p>Written by: {{ blog.author.username }}</p>

  <form action="" method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <input type="submit" value="Submit">
  </form>
{% endblock %}
