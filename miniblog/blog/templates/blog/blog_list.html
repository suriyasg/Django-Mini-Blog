{% extends "base_generic.html" %}

{% block content %}
  <h1>Blog List</h1>
  {% if blog_list %}
    <ul>
      {% for blog in blog_list %}
      <li>
        <a href="{{ blog.get_absolute_url }}">{{ blog.title }}</a>
         posted on : {{ blog.posted_on }}
        (by: <a href="{{ blog.author.get_absolute_url }}">{{ blog.author.user_name }}</a>)
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no blogs in the BlogSite.</p>
  {% endif %}
{% endblock %}
