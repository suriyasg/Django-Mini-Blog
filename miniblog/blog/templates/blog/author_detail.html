{% extends "base_generic.html" %}

{% block content %}
<h1>{{ author.username }}</h1>
<hr>
<h4>Bio</h4>
<p>{{ author.bio }}</p>


<hr />
<h4> Blogs </h4>
<ul>
    {% for blog in author.blog_set.all %}
        <li><a href="{{ blog.get_absolute_url }}">{{ blog.title }}</a>  posted on: {{ blog.posted_on }}</li>
    {% empty %}
        <p>Author hasn't written anything!</p>
    {% endfor %}
</ul>
{% endblock %}
